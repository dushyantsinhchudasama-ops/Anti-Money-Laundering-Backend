spring.application.name=aml

spring.profiles.active=dev

spring.datasource.url=jdbc:postgresql://localhost:5432/your_database
spring.datasource.username=username
spring.datasource.password=password

server.port=8081

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# JWT configuration (required by JwtTokenProvider)
app.jwt.secret=change-me-to-secure-random-key-of-sufficient-length
# expiration in milliseconds (e.g., 86400000 = 1 day)
app.jwt.expiration=86400000

# Flyway configuration for system/public migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/public
spring.flyway.schemas=public

# Default System Admin Bootstrap Configuration
app.bootstrap-admin.email=admin@aml.com
app.bootstrap-admin.password=Admin@123
app.bootstrap-admin.code=SYSADMIN001
app.bootstrap-admin.first-name=System
app.bootstrap-admin.last-name=Admin
app.bootstrap-admin.phone-number=0000000000


